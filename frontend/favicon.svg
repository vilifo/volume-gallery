<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest">
  <title>CT volume viewer</title>
  <!-- A volume as three stacked planes of gold voxels (3x3x3). Gaps let the eye finish the cube; gradients give soft shading, rounded joins remove hard corners. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffc42e"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e5a10c"/>
      <stop offset="1" stop-color="#9c5f00"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b820"/>
      <stop offset="1" stop-color="#bf7a00"/>
    </linearGradient>
    <g id="vox" stroke-linejoin="round" stroke-width="0.5">
      <polygon points="-3.6,0 0,2.08 0,6.08 -3.6,4" fill="url(#left)" stroke="#c07c05"/>
      <polygon points="0,2.08 3.6,0 3.6,4 0,6.08" fill="url(#right)" stroke="#d99410"/>
      <polygon points="0,-2.08 3.6,0 0,2.08 -3.6,0" fill="url(#top)" stroke="#ffd95c"/>
    </g>
    <!-- one 3x3 plane, back to front -->
    <g id="plane">
      <use href="#vox" x="16" y="3.16"/>
      <use href="#vox" x="20.8" y="5.93"/>
      <use href="#vox" x="11.2" y="5.93"/>
      <use href="#vox" x="25.6" y="8.7"/>
      <use href="#vox" x="16" y="8.7"/>
      <use href="#vox" x="6.4" y="8.7"/>
      <use href="#vox" x="20.8" y="11.47"/>
      <use href="#vox" x="11.2" y="11.47"/>
      <use href="#vox" x="16" y="14.24"/>
    </g>
  </defs>
  <!-- bottom to top -->
  <use href="#plane" y="10.6"/>
  <use href="#plane" y="5.3"/>
  <use href="#plane"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

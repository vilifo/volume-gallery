<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Assets Gallery</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    font-size: 0.75em;
    font-family: var(--mono);
    padding: 0.15em 0.55em;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .status-badge.processing { color: var(--accent); border-color: var(--accent-dim); }
  .status-badge.failed { color: var(--danger); border-color: var(--danger); }
  .status-badge .mini-spinner {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid rgba(232, 163, 61, 0.3);
    border-top-color: var(--accent);
    animation: vg-spin 0.7s linear infinite;
  }
  @keyframes vg-spin { to { transform: rotate(360deg); } }

  .asset-row .log-line {
    font-size: 0.78em;
    color: var(--text-dim);
    margin-top: 0.25em;
    font-family: var(--mono);
  }
  .asset-row .log-line.failed { color: var(--danger); }
  .asset-row .title.disabled { color: var(--text-dim); pointer-events: none; }

  .asset-row.just-uploaded {
    animation: vg-highlight 2.5s ease-out;
    border-radius: var(--radius);
  }
  @keyframes vg-highlight {
    0%   { background: rgba(232, 163, 61, 0.18); }
    100% { background: transparent; }
  }
</style>
</head>
<body>
  <div class="app-shell" id="shell"></div>

  <script type="module">
    import { api, requireLogin, getRole, getUsername, renderShell, wireLogout } from "/js/api.js";

    requireLogin();
    const role = getRole();

    const params = new URLSearchParams(window.location.search);
    const justUploadedId = params.get("justUploaded");
    if (justUploadedId) {
      // Don't leave it in the URL — a refresh shouldn't re-trigger the highlight.
      window.history.replaceState({}, "", "/index.html");
    }

    document.getElementById("shell").innerHTML = `
      ${renderShell("gallery", role, getUsername())}
      <main>
        <div class="toolbar">
          <div>
            <h1>Gallery</h1>
            <p class="subtitle">Assets you can view.</p>
          </div>
        </div>
        <div id="list"></div>
      </main>
    `;
    wireLogout();

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function statusBadge(v) {
      if (v.status === "processing") {
        return `<span class="status-badge processing"><span class="mini-spinner"></span>processing</span>`;
      }
      if (v.status === "failed") {
        return `<span class="status-badge failed">failed</span>`;
      }
      return "";
    }

    function latestLogLine(v) {
      if (v.status === "ready" || !v.status_log || v.status_log.length === 0) return "";
      const last = v.status_log[v.status_log.length - 1];
      // Log lines are "HH:MM:SS  message" — drop the timestamp for the inline readout.
      const message = last.replace(/^\d{2}:\d{2}:\d{2}\s+/, "");
      const cls = v.status === "failed" ? "failed" : "";
      return `<div class="log-line ${cls}">${escapeHtml(message)}</div>`;
    }

    function renderRow(v) {
      const viewable = v.status === "ready";
      return `
        <div class="asset-row" data-asset-row="${v.id}">
          <div class="swatch">CT</div>
          <div class="meta">
            <div class="title">
              ${
                viewable
                  ? `<a href="/viewer.html?id=${v.id}">${escapeHtml(v.title)}</a>`
                  : `<span class="disabled">${escapeHtml(v.title)}</span>`
              }
              ${statusBadge(v)}
            </div>
            <div class="slug">${escapeHtml(v.slug)}${v.has_mesh ? " · mesh available" : ""}</div>
            ${latestLogLine(v)}
          </div>
          <div class="actions">
            ${viewable ? `<a href="/viewer.html?id=${v.id}"><button>Open</button></a>` : ""}
            ${
              role === "admin" || role === "editor"
                ? `<button data-manage="${v.id}">Manage</button>`
                : ""
            }
          </div>
        </div>`;
    }

    function wireRowActions(listEl) {
      listEl.querySelectorAll("[data-manage]").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.location.href = `/manage.html?id=${btn.dataset.manage}`;
        });
      });
    }

    let pollTimer = null;

    async function load({ isPoll = false } = {}) {
      const listEl = document.getElementById("list");
      let assets;
      try {
        assets = await api.listAssets();
      } catch (err) {
        if (!isPoll) listEl.innerHTML = `<div class="error-box">${err.message}</div>`;
        return;
      }

      if (assets.length === 0) {
        listEl.innerHTML = `<div class="empty-state">
          No assets yet.${role !== "reader" ? " Use \u201cUpload asset\u201d to add one." : " Ask an editor to grant you access."}
        </div>`;
        return;
      }

      listEl.innerHTML = assets.map(renderRow).join("");
      wireRowActions(listEl);

      if (justUploadedId) {
        const row = listEl.querySelector(`[data-asset-row="${justUploadedId}"]`);
        if (row) {
          row.classList.add("just-uploaded");
          row.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      const stillProcessing = assets.some((v) => v.status === "processing");
      clearTimeout(pollTimer);
      if (stillProcessing) {
        pollTimer = setTimeout(() => load({ isPoll: true }), 1500);
      }
    }

    load();
  </script>
</body>
</html>

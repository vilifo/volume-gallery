<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Volume Gallery</title>
<script src="/js/theme-init.js?v=hist1"></script>
<link rel="stylesheet" href="/css/style.css?v=brand2" />
<style>
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    font-size: 0.75em;
    font-family: var(--mono);
    padding: 0.15em 0.55em;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .status-badge.processing { color: var(--accent); border-color: var(--accent-dim); }
  .status-badge.failed { color: var(--danger); border-color: var(--danger); }
  .status-badge .mini-spinner {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid rgba(232, 163, 61, 0.3);
    border-top-color: var(--accent);
    animation: vg-spin 0.7s linear infinite;
  }
  @keyframes vg-spin { to { transform: rotate(360deg); } }

  .asset-row .log-line {
    font-size: 0.78em;
    color: var(--text-dim);
    margin-top: 0.25em;
    font-family: var(--mono);
  }
  .asset-row .log-line.failed { color: var(--danger); }
  .asset-row .title.disabled { color: var(--text-dim); pointer-events: none; }

  .asset-row.just-uploaded {
    animation: vg-highlight 2.5s ease-out;
    border-radius: var(--radius);
  }
  @keyframes vg-highlight {
    0%   { background: rgba(232, 163, 61, 0.18); }
    100% { background: transparent; }
  }
</style>
</head>
<body>
  <div class="app-shell" id="shell"></div>

  <script type="module">
    import { api, requireLogin, getRole, getUsername, renderShell, wireLogout, getBranding, contactItems } from "/js/api.js?v=brand2";
    import { openHelp } from "/js/help.js?v=help1";

    requireLogin();
    const role = getRole();

    const params = new URLSearchParams(window.location.search);
    let justUploadedId = params.get("justUploaded");
    if (justUploadedId) {
      window.history.replaceState({}, "", "/index.html");
    }

    document.getElementById("shell").innerHTML = `
      ${renderShell("gallery", role, getUsername())}
      <main>
        <div class="toolbar">
          <div>
            <h1>Gallery</h1>
            <p class="subtitle">Assets you can view.</p>
          </div>
          <button type="button" id="help-btn" title="How to use the gallery">? Help</button>
        </div>
        <div id="list"></div>
      </main>
    `;
    wireLogout();

    // Help: opened by the button or by a link ending in #help. The content follows the user's role.
    let helpOpen = false;
    async function showHelp() {
      if (helpOpen) return;
      helpOpen = true;
      const branding = await getBranding();
      openHelp({
        role, branding, contactItems: contactItems(branding),
        onClose: () => {
          helpOpen = false;
          if (window.location.hash === "#help") history.replaceState({}, "", window.location.pathname + window.location.search);
        },
      });
    }
    document.getElementById("help-btn").addEventListener("click", showHelp);
    if (window.location.hash === "#help") showHelp();

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function statusBadge(v) {
      if (v.status === "processing") {
        return `<span class="status-badge processing"><span class="mini-spinner"></span>processing</span>`;
      }
      if (v.status === "uploaded") {
        return `<span class="status-badge" title="The upload was not completed">incomplete upload</span>`;
      }
      if (v.status === "failed") {
        return `<span class="status-badge failed">failed</span>`;
      }
      return "";
    }

    function latestLogLine(v) {
      if (v.status === "ready" || !v.status_log || v.status_log.length === 0) return "";
      const last = v.status_log[v.status_log.length - 1];
      const message = last.replace(/^\d{2}:\d{2}:\d{2}\s+/, "");
      const cls = v.status === "failed" ? "failed" : "";
      return `<div class="log-line ${cls}">${escapeHtml(message)}</div>`;
    }

    function getSwatchText(assetType) {
      if (assetType === "mesh") return "MSH";
      if (assetType === "pointcloud") return "PTS";
      return "CT"; // default/volume
    }

    function renderRow(v) {
      const viewable = v.status === "ready";
      const swatch = getSwatchText(v.asset_type);
      const extraMeta = (v.asset_type === "volume" && v.mesh) ? " · mesh available" : "";

      const cached = thumbCache.get(`${v.asset_type}:${v.id}`);
      return `
        <div class="asset-row" data-asset-row="${v.id}">
          <div class="swatch" ${v.has_thumbnail ? `data-thumb="${v.asset_type}:${v.id}"` : ""}>${
            cached ? `<img src="${cached}" alt="" />` : swatch
          }</div>
          <div class="meta">
            <div class="title">
              ${
                viewable
                  ? `<a href="/viewers/${v.asset_type}.html?id=${v.id}">${escapeHtml(v.title)}</a>`
                  : `<span class="disabled">${escapeHtml(v.title)}</span>`
              }
              ${statusBadge(v)}
            </div>
            <div class="slug">${escapeHtml(v.slug)}${extraMeta}</div>
            ${latestLogLine(v)}
          </div>
          <div class="actions">
            ${viewable ? `<a href="/viewers/${v.asset_type}.html?id=${v.id}"><button>Open</button></a>` : ""}
            ${
              role === "admin" || role === "editor"
                ? `<button data-manage="${v.id}" data-kind="${v.asset_type}">Manage</button>`
                : ""
            }
          </div>
        </div>`;
    }

    // blob: URLs of the thumbnails fetched so far, so the list's periodic re-render
    // (while something is processing) does not fetch them all again.
    const thumbCache = new Map();

    function loadThumbnails(listEl) {
      listEl.querySelectorAll("[data-thumb]").forEach(async (el) => {
        const key = el.dataset.thumb;
        if (thumbCache.has(key) || el.querySelector("img")) return;
        const [kind, id] = key.split(":");
        const url = await api.thumbnailUrl(kind, id);
        if (!url) return;
        thumbCache.set(key, url);
        el.innerHTML = `<img src="${url}" alt="" />`;
      });
    }

    function wireRowActions(listEl) {
      listEl.querySelectorAll("[data-manage]").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.location.href = `/manage.html?id=${btn.dataset.manage}&kind=${btn.dataset.kind}`;
        });
      });
    }

    let pollTimer = null;

    async function load({ isPoll = false } = {}) {
      const listEl = document.getElementById("list");
      let assets = [];
      try {
        const [volumes, meshes, pointclouds] = await Promise.all([
          api.listVolumes(),
          api.listMeshes(),
          api.listPointClouds()
        ]);

        volumes.forEach(v => v.asset_type = "volume");
        meshes.forEach(m => m.asset_type = "mesh");
        pointclouds.forEach(p => p.asset_type = "pointcloud");

        assets = [...volumes, ...meshes, ...pointclouds];
      } catch (err) {
        if (!isPoll) listEl.innerHTML = `<div class="error-box">${err.message}</div>`;
        return;
      }

      if (assets.length === 0) {
        listEl.innerHTML = `<div class="empty-state">
          No assets yet.${role !== "reader" ? " Use \u201cUpload asset\u201d to add one." : " Ask an editor to grant you access."}
        </div>`;
        return;
      }

      listEl.innerHTML = assets.map(renderRow).join("");
      wireRowActions(listEl);
      loadThumbnails(listEl);

      if (justUploadedId) {
        const matchingRows = Array.from(listEl.querySelectorAll(`[data-asset-row="${justUploadedId}"]`));
        const row = matchingRows.find(r => r.querySelector('.processing')) || matchingRows[0];

        if (row) {
          row.classList.add("just-uploaded");
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          justUploadedId = null;
        }
      }

      const stillProcessing = assets.some((v) => v.status === "processing");
      clearTimeout(pollTimer);
      if (stillProcessing) {
        pollTimer = setTimeout(() => load({ isPoll: true }), 1500);
      }
    }

    load();
  </script>
</body>
</html>

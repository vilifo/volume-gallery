<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload asset — Volume Gallery</title>
    <script><%= require("./js/theme-init.js?raw") %></script>
    <link rel="stylesheet" href="<%= require('./css/style.css') %>"/>
    <style>
        .source-toggle {
            display: flex;
            gap: 0.5em;
            margin-bottom: 1.4em;
        }

        .source-toggle button {
            flex: 1;
            padding: 0.7em 1em;
            text-align: center;
        }

        .source-toggle button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            font-weight: 600;
        }

        .field-hint {
            font-size: 0.82em;
            color: var(--text-dim);
            margin-top: 0.35em;
        }

        /* --- upload progress animation --- */
        .upload-progress {
            max-width: 480px;
            margin-top: 0.5em;
        }

        .upload-progress .stage-label {
            display: flex;
            align-items: center;
            gap: 0.6em;
            font-size: 0.95em;
            margin-bottom: 0.9em;
        }

        .upload-progress .spinner {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--line);
            border-top-color: var(--accent);
            animation: vg-spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        .upload-progress .checkmark {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--ok);
        }

        @keyframes vg-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .upload-progress .bar-track {
            position: relative;
            height: 8px;
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: 5px;
            overflow: hidden;
        }

        .upload-progress .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: var(--accent);
            border-radius: 5px;
            transition: width 0.15s ease;
        }

        /* Indeterminate mode (waiting on the server after the upload itself hit
           100%, before it's had a chance to respond): a sliding highlight instead
           of a stalled-looking full bar. */
        .upload-progress .bar-track.indeterminate .bar-fill {
            width: 40% !important;
            animation: vg-indeterminate 1.1s ease-in-out infinite;
        }

        @keyframes vg-indeterminate {
            0% {
                left: -40%;
            }
            100% {
                left: 100%;
            }
        }

        .upload-progress .bar-percent {
            font-family: var(--mono);
            font-size: 0.8em;
            color: var(--text-dim);
            text-align: right;
            margin-top: 0.4em;
        }
    </style>
</head>
<body>
<div class="app-shell" id="shell"></div>

</body>
</html>

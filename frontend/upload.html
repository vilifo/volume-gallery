<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload volume — Volume Gallery</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .source-toggle { display: flex; gap: 0.5em; margin-bottom: 1.4em; }
  .source-toggle button {
    flex: 1;
    padding: 0.7em 1em;
    text-align: center;
  }
  .source-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1400;
    font-weight: 600;
  }
  .field-hint { font-size: 0.82em; color: var(--text-dim); margin-top: 0.35em; }

  /* --- upload progress animation --- */
  .upload-progress {
    max-width: 480px;
    margin-top: 0.5em;
  }
  .upload-progress .stage-label {
    display: flex;
    align-items: center;
    gap: 0.6em;
    font-size: 0.95em;
    margin-bottom: 0.9em;
  }
  .upload-progress .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: vg-spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .upload-progress .checkmark {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--ok);
  }
  @keyframes vg-spin { to { transform: rotate(360deg); } }

  .upload-progress .bar-track {
    position: relative;
    height: 8px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .upload-progress .bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 5px;
    transition: width 0.15s ease;
  }
  /* Indeterminate mode (waiting on the server after the upload itself hit
     100%, before it's had a chance to respond): a sliding highlight instead
     of a stalled-looking full bar. */
  .upload-progress .bar-track.indeterminate .bar-fill {
    width: 40% !important;
    animation: vg-indeterminate 1.1s ease-in-out infinite;
  }
  @keyframes vg-indeterminate {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
  .upload-progress .bar-percent {
    font-family: var(--mono);
    font-size: 0.8em;
    color: var(--text-dim);
    text-align: right;
    margin-top: 0.4em;
  }
</style>
</head>
<body>
  <div class="app-shell" id="shell"></div>

  <script type="module">
    import { api, requireLogin, getRole, getUsername, renderShell, wireLogout } from "/js/api.js";

    requireLogin();
    const role = getRole();
    if (role !== "editor" && role !== "admin") {
      window.location.href = "/index.html";
    }

    // Deliberately NOT using the JS RegExp "v" (unicodeSets) flag or an HTML
    // pattern="..." attribute here — browsers increasingly compile <input
    // pattern> with the "v" flag, whose character-class grammar is stricter
    // (and inconsistent across engines) than a plain RegExp literal like
    // this one. Keep this in sync with SLUG_RE in backend/app/routers/volumes.py.
    const SLUG_RE = /^[a-z0-9][a-z0-9_-]{1,62}$/;

    document.getElementById("shell").innerHTML = `
      ${renderShell("upload", role, getUsername())}
      <main>
        <h1>Upload volume</h1>
        <p class="subtitle">
          Provide either an OME-Zarr archive or a TIFF stack — a TIFF stack is
          converted to OME-Zarr on the server, then the original TIFF files
          are deleted. A mesh file is optional and served separately for
          download.
        </p>
        <div id="error" style="display:none" class="error-box"></div>

        <div class="source-toggle">
          <button type="button" id="src-zarr" class="active">OME-Zarr (.zip)</button>
          <button type="button" id="src-tiff">TIFF stack (.zip of .tif files)</button>
        </div>

        <form id="form">
          <div class="field">
            <label for="slug">Slug (used in URLs, lowercase, no spaces)</label>
            <input id="slug" required placeholder="femur-scan-01" />
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" required placeholder="Femur scan #01" />
          </div>
          <div class="field">
            <label for="description">Description</label>
            <input id="description" placeholder="Optional" />
          </div>

          <div class="field" id="zarr-field">
            <label for="zarr_zip">OME-Zarr archive (.zip)</label>
            <input id="zarr_zip" type="file" accept=".zip" />
            <div class="field-hint">A .zip containing the .ome.zarr (or .zarr) directory.</div>
          </div>

          <div class="field" id="tiff-field" style="display:none">
            <label for="tiff_zip">TIFF stack (.zip of .tif files)</label>
            <input id="tiff_zip" type="file" accept=".zip" />
            <div class="field-hint">
              A flat .zip of single-slice .tif/.tiff files (one per Z position). Filenames
              are sorted to determine slice order, so name them so alphabetical order
              matches acquisition order (e.g. slice_0001.tif, slice_0002.tif, \u2026).
              Large stacks are loaded into memory in full during conversion, so keep an
              eye on available RAM for very large scans.
            </div>
          </div>

          <div class="field">
            <label for="mesh_file">Mesh file (optional — .stl, .obj, .ply, \u2026)</label>
            <input id="mesh_file" type="file" />
          </div>
          <button type="submit" class="primary">Upload</button>
        </form>

        <div class="upload-progress" id="upload-progress" style="display:none">
          <div class="stage-label">
            <div class="spinner" id="progress-spinner"></div>
            <svg class="checkmark" id="progress-check" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            <span id="progress-label">Uploading\u2026</span>
          </div>
          <div class="bar-track" id="progress-track">
            <div class="bar-fill" id="progress-fill"></div>
          </div>
          <div class="bar-percent" id="progress-percent">0%</div>
        </div>
      </main>
    `;
    wireLogout();

    let source = "zarr";
    const srcZarrBtn = document.getElementById("src-zarr");
    const srcTiffBtn = document.getElementById("src-tiff");
    const zarrField = document.getElementById("zarr-field");
    const tiffField = document.getElementById("tiff-field");

    function setSource(next) {
      source = next;
      srcZarrBtn.classList.toggle("active", source === "zarr");
      srcTiffBtn.classList.toggle("active", source === "tiff");
      zarrField.style.display = source === "zarr" ? "" : "none";
      tiffField.style.display = source === "tiff" ? "" : "none";
    }
    srcZarrBtn.addEventListener("click", () => setSource("zarr"));
    srcTiffBtn.addEventListener("click", () => setSource("tiff"));

    const form = document.getElementById("form");
    const errorBox = document.getElementById("error");
    const progressBox = document.getElementById("upload-progress");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const progressPercent = document.getElementById("progress-percent");
    const progressLabel = document.getElementById("progress-label");
    const progressSpinner = document.getElementById("progress-spinner");
    const progressCheck = document.getElementById("progress-check");

    function setIndeterminate(label) {
      progressTrack.classList.add("indeterminate");
      progressPercent.textContent = "";
      progressLabel.textContent = label;
    }
    function setProgress(fraction) {
      progressTrack.classList.remove("indeterminate");
      const pct = Math.round(fraction * 100);
      progressFill.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;
      progressLabel.textContent = pct < 100 ? "Uploading\u2026" : "Finishing up\u2026";
      if (pct >= 100) setIndeterminate("Finishing up\u2026");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const slug = document.getElementById("slug").value.trim();
      if (!SLUG_RE.test(slug)) {
        errorBox.textContent =
          "Slug must start with a lowercase letter or digit, and contain only " +
          "lowercase letters, digits, hyphens, and underscores (2\u201363 characters).";
        errorBox.style.display = "block";
        return;
      }

      const sourceFile =
        source === "zarr"
          ? document.getElementById("zarr_zip").files[0]
          : document.getElementById("tiff_zip").files[0];
      if (!sourceFile) {
        errorBox.textContent =
          source === "zarr" ? "Choose an OME-Zarr .zip file." : "Choose a TIFF stack .zip file.";
        errorBox.style.display = "block";
        return;
      }

      const fd = new FormData();
      fd.append("slug", slug);
      fd.append("title", document.getElementById("title").value.trim());
      fd.append("description", document.getElementById("description").value.trim());
      if (source === "zarr") {
        fd.append("zarr_zip", sourceFile);
      } else {
        fd.append("tiff_zip", sourceFile);
      }
      const meshFile = document.getElementById("mesh_file").files[0];
      if (meshFile) fd.append("mesh_file", meshFile);

      form.style.display = "none";
      progressBox.style.display = "block";
      progressSpinner.style.display = "block";
      progressCheck.style.display = "none";
      setProgress(0);

      try {
        const volume = await api.createVolumeWithProgress(fd, setProgress);
        progressSpinner.style.display = "none";
        progressCheck.style.display = "block";
        progressTrack.classList.remove("indeterminate");
        progressFill.style.width = "100%";
        progressPercent.textContent = "";
        progressLabel.textContent = "Uploaded \u2014 processing in the background";
        // The heavy lifting (extraction / TIFF conversion) now happens
        // server-side after this response, tracked by volume.status; the
        // gallery polls that and shows it live, so hand off there rather
        // than making the user sit on this page waiting for it.
        setTimeout(() => {
          window.location.href = `/index.html?justUploaded=${volume.id}`;
        }, 500);
      } catch (err) {
        form.style.display = "";
        progressBox.style.display = "none";
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>

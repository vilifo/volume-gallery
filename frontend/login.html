<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Volume Gallery</title>
<script><%= require("./js/theme-init.js?raw") %></script>
<link rel="stylesheet" href="<%= require('./css/style.css') %>" />
</head>
<body>
  <div class="login-shell">
   <div class="login-col">
    <div class="login-box">
      <div class="login-brand" data-pending>
        <div class="brand-logos" id="brand-logos"></div>
        <h1 id="app-name">Volume Gallery</h1>
        <p class="tagline" id="tagline"></p>
      </div>
      <p class="subtitle">Sign in to view or manage assets.</p>
      <div id="error" style="display:none" class="error-box"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary" style="width:100%">Sign in</button>
      </form>
    </div>
    <footer class="login-footer" id="login-footer" data-pending></footer>
   </div>
  </div>

</body>
</html>

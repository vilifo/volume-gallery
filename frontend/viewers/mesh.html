<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mesh Viewer — Volume Gallery</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/vendor/3dhop/stylesheet/3dhop.css" />
<style>
  body.viewer-page { overflow: hidden; }
  body.viewer-page .app-shell { height: 100vh; }
  body.viewer-page main {
    padding: 0; max-width: none; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .viewer-topbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5em;
    padding: 0.9em 1.4em; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--panel);
  }
  .viewer-topbar .viewer-titles { min-width: 0; }
  .viewer-topbar h1 { font-size: 1.1em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-topbar .viewer-desc { font-size: 0.83em; color: var(--text-dim); margin-top: 0.2em; max-width: 60ch; }
  .viewer-topbar-actions { display: flex; gap: 0.6em; flex-shrink: 0; }
  .icon-btn { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.5em 0.9em; white-space: nowrap; }
  .icon-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .mesh-render-area { flex: 1; min-height: 0; position: relative; background: #000; }
  /* 3DHOP's own #3dhop/#draw-canvas fill whatever box they're placed in. */
  #3dhop, #draw-canvas { width: 100%; height: 100%; }
  #tdhlg { position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  .mesh-toolbar {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(26, 29, 35, 0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;
    padding: 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .mesh-toolbar button {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 6px; color: var(--text-dim); cursor: pointer;
  }
  .mesh-toolbar button:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  .mesh-toolbar button.active { color: var(--accent); }
  .mesh-toolbar svg { width: 16px; height: 16px; }

  .viewer-status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-family: var(--mono); font-size: 0.85em;
    background: rgba(0, 0, 0, 0.6); padding: 1.5em; text-align: left; line-height: 1.5;
  }
</style>
</head>
<body class="viewer-page">
  <div class="app-shell" id="shell"></div>

  <!-- 3DHOP's own scripts — order matters (spidergl -> jquery -> presenter -> nexus -> trackball). -->
  <script src="/vendor/3dhop/js/spidergl.js"></script>
  <script src="/vendor/3dhop/js/jquery.js"></script>
  <script src="/vendor/3dhop/js/presenter.js"></script>
  <script src="/vendor/3dhop/js/nexus.js"></script>
  <script src="/vendor/3dhop/js/trackball_turntable.js"></script>

  <script type="module">
    import { api, requireLogin, getRole, getUsername, renderShell, wireLogout } from "/js/api.js";

    requireLogin();
    const role = getRole();
    const params = new URLSearchParams(window.location.search);
    const meshId = params.get("id");
    const volumeId = params.get("volume");

    const HOME_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>`;
    const ZOOM_IN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>`;
    const ZOOM_OUT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>`;
    const LIGHT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
    const DOWNLOAD_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>`;
    const BACK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>`;
    const EXPAND_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>`;

    document.getElementById("shell").innerHTML = `
      ${renderShell("gallery", role, getUsername())}
      <main><div id="content" style="display:flex; flex-direction:column; height:100%;"></div></main>
    `;
    wireLogout();

    const content = document.getElementById("content");

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function init() {
      if (!meshId && !volumeId) {
        content.innerHTML = `<div class="error-box" style="margin:1.4em">No mesh specified.</div>`;
        return;
      }
      let mesh;
      try {
         if (volumeId) {
          const volume = await api.getVolume(volumeId);
          if (!volume.has_mesh) throw new Error("This volume has no mesh.");
          mesh = {
            title: `${volume.title} \u2014 mesh`,
            description: volume.description,
            can_download: true, // the volume's permission applies
          };
        } else {
          mesh = await api.getMesh(meshId);
        }
      } catch (err) {
        content.innerHTML = `<div class="error-box" style="margin:1.4em">${err.message}</div>`;
        return;
      }

      content.innerHTML = `
        <div class="viewer-topbar">
          <div class="viewer-titles">
            <h1>${escapeHtml(mesh.title)}</h1>
            ${mesh.description ? `<div class="viewer-desc">${escapeHtml(mesh.description)}</div>` : ""}
          </div>
          <div class="viewer-topbar-actions">
            ${volumeId ? `<a href="/viewers/volume.html?id=${encodeURIComponent(volumeId)}"><button type="button" class="icon-btn">${BACK_ICON}<span>Back to volume</span></button></a>` : ""}
            ${mesh.can_download ? `<button id="download-btn" class="icon-btn">${DOWNLOAD_ICON}<span>Download</span></button>` : ""}
            <button id="fullscreen-btn" class="icon-btn primary">${EXPAND_ICON}<span>Fullscreen</span></button>
          </div>
        </div>
        <div class="mesh-render-area" id="render-area">
          <div id="3dhop" class="tdhop"><div id="tdhlg"></div><canvas id="draw-canvas"></canvas></div>
          <div class="mesh-toolbar">
            <button type="button" id="home-btn" title="Reset view">${HOME_ICON}</button>
            <button type="button" id="zoomin-btn" title="Zoom in">${ZOOM_IN_ICON}</button>
            <button type="button" id="zoomout-btn" title="Zoom out">${ZOOM_OUT_ICON}</button>
            <button type="button" id="light-btn" title="Move light instead of camera">${LIGHT_ICON}</button>
          </div>
          <div class="viewer-status" id="status">Loading mesh viewer\u2026</div>
        </div>
      `;

      const statusEl = document.getElementById("status");
      const renderArea = document.getElementById("render-area");

      document.getElementById("fullscreen-btn").addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else renderArea.requestFullscreen().catch((err) => alert(`Couldn't enter fullscreen: ${err.message}`));
      });

      const downloadBtn = document.getElementById("download-btn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", async () => {
          try {
            const access = volumeId
              ? await api.meshAccessUrl(volumeId)
              : await api.meshDownloadAccessUrl(meshId);
            window.location.href = access.url;
          } catch (err) {
            alert(err.message);
          }
        });
      }

      if (!window.WebGLRenderingContext) {
        statusEl.textContent = "This browser doesn't support WebGL, which the mesh viewer needs.";
        return;
      }

      try {
        const access = volumeId
          ? await api.volumeMeshViewUrl(volumeId)
          : await api.meshNxzAccessUrl(meshId);

        // Trick 3DHOP's string parser into seeing a clean ".nxz" extension
        // by appending a dummy parameter.
        let safeUrl = access.url;
        safeUrl += (safeUrl.includes("?") ? "&" : "?") + "_ext=.nxz";

        const presenter = new Presenter("draw-canvas");

        // Synchronize WebGL buffer size with actual CSS DOM size
        function resizeCanvas() {
          const canvas = document.getElementById("draw-canvas");
          const wrap = document.getElementById("3dhop");
          if (canvas && wrap) {
            canvas.width = wrap.clientWidth;
            canvas.height = wrap.clientHeight;
          }
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); // Set initial sizes

        presenter.setScene({
          meshes: { "mesh_1": { url: safeUrl } },
          modelInstances: {
            "model_1": {
              mesh: "mesh_1",
              color: [0.8, 0.8, 0.8]
            }
          },
          trackball: {
            type: TurnTableTrackball,
            trackOptions: {
              startPhi: 35.0, startTheta: 15.0, startDistance: 2.5,
              minMaxPhi: [-180, 180], minMaxTheta: [-89, 89], minMaxDist: [0.1, 10.0],
            },
          },
        });

        statusEl.style.display = "none";

        // Disable context menu so right-click panning works natively
        document.getElementById("draw-canvas").addEventListener("contextmenu", (e) => e.preventDefault());

        document.getElementById("home-btn").addEventListener("click", () => presenter.resetTrackball());
        document.getElementById("zoomin-btn").addEventListener("click", () => presenter.zoomIn());
        document.getElementById("zoomout-btn").addEventListener("click", () => presenter.zoomOut());

        const lightBtn = document.getElementById("light-btn");
        lightBtn.addEventListener("click", () => {
          presenter.enableLightTrackball(!presenter.isLightTrackballEnabled());
          lightBtn.classList.toggle("active", presenter.isLightTrackballEnabled());
        });
      } catch (err) {
        statusEl.textContent = `Could not load mesh: ${err.message}`;
        statusEl.style.display = "flex";
      }
    }

    init();
  </script>
</body>
</html>

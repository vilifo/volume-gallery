<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Point Cloud Viewer — Volume Gallery</title>
<script src="/js/theme-init.js?v=theme2"></script>
<link rel="stylesheet" href="/css/style.css?v=theme2" />
<link rel="stylesheet" href="/vendor/potree/potree.css" />
<link rel="stylesheet" href="/vendor/libs/jquery-ui/jquery-ui.min.css" />
<link rel="stylesheet" href="/vendor/libs/openlayers3/ol.css" />
<link rel="stylesheet" href="/vendor/libs/spectrum/spectrum.css" />
<link rel="stylesheet" href="/vendor/libs/jstree/themes/mixed/style.css" />
<style>
  body.viewer-page { overflow: hidden; }
  body.viewer-page .app-shell { height: 100vh; }
  body.viewer-page main {
    padding: 0; max-width: none; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .viewer-topbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5em;
    padding: 0.9em 1.4em; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--panel);
  }
  .viewer-topbar .viewer-titles { min-width: 0; }
  .viewer-topbar h1 { font-size: 1.1em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-topbar .viewer-desc { font-size: 0.83em; color: var(--text-dim); margin-top: 0.2em; max-width: 60ch; }
  .viewer-topbar-actions { display: flex; gap: 0.6em; flex-shrink: 0; }
  .icon-btn { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.5em 0.9em; white-space: nowrap; }
  .icon-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .pc-render-area { flex: 1; min-height: 0; position: relative; background: #000; }
  /* Potree's native sidebar (sidebar.html) is loaded by viewer.loadGUI() into
     #potree_sidebar_container; viewer.toggleSidebar() shifts the render area's
     "left" offset, so it must be absolutely positioned and sized by its edges. */
  .pc-render-area .potree_container { position: absolute; inset: 0; }
  #potree_render_area {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: auto; height: auto;
  }

  .viewer-status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-family: var(--mono); font-size: 0.85em;
    background: rgba(0, 0, 0, 0.6); padding: 1.5em; text-align: left; line-height: 1.5;
  }
</style>
</head>
<body class="viewer-page">
  <div class="app-shell" id="shell"></div>

  <script src="/vendor/libs/jquery/jquery-3.1.1.js"></script>
  <script src="/vendor/libs/spectrum/spectrum.js"></script>
  <script src="/vendor/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="/vendor/libs/other/BinaryHeap.js"></script>
  <script src="/vendor/libs/tween/tween.min.js"></script>
  <script src="/vendor/libs/d3/d3.js"></script>
  <script src="/vendor/libs/proj4/proj4.js"></script>
  <script src="/vendor/libs/openlayers3/ol.js"></script>
  <script src="/vendor/libs/i18next/i18next.js"></script>
  <script src="/vendor/libs/jstree/jstree.js"></script>
  <script src="/vendor/potree/potree.js"></script>

  <script type="module">
    import { api, requireLogin, getRole, getUsername, renderShell, wireLogout } from "/js/api.js?v=theme2";

    requireLogin();
    const role = getRole();
    const params = new URLSearchParams(window.location.search);
    const pcId = params.get("id");

    const EXPAND_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>`;

    document.getElementById("shell").innerHTML = `
      ${renderShell("gallery", role, getUsername())}
      <main><div id="content" style="display:flex; flex-direction:column; height:100%;"></div></main>
    `;
    wireLogout();

    const content = document.getElementById("content");

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function init() {
      if (!pcId) {
        content.innerHTML = `<div class="error-box" style="margin:1.4em">No point cloud specified.</div>`;
        return;
      }
      let pc;
      try {
        pc = await api.getPointCloud(pcId);
      } catch (err) {
        const safeMessage = escapeHtml(String(err?.message ?? "Failed to load point cloud."));
        content.innerHTML = `<div class="error-box" style="margin:1.4em">${safeMessage}</div>`;
        return;
      }

      content.innerHTML = `
        <div class="viewer-topbar">
          <div class="viewer-titles">
            <h1>${escapeHtml(pc.title)}</h1>
            ${pc.description ? `<div class="viewer-desc">${escapeHtml(pc.description)}</div>` : ""}
          </div>
          <div class="viewer-topbar-actions">
            <button id="fullscreen-btn" class="icon-btn primary">${EXPAND_ICON}<span>Fullscreen</span></button>
          </div>
        </div>
        <div class="pc-render-area" id="render-area">
          <div class="potree_container">
            <div id="potree_render_area"></div>
            <div id="potree_sidebar_container"></div>
          </div>
          <div class="viewer-status" id="status">Loading point cloud viewer\u2026</div>
        </div>
      `;

      const statusEl = document.getElementById("status");
      const renderArea = document.getElementById("render-area");

      document.getElementById("fullscreen-btn").addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else renderArea.requestFullscreen().catch((err) => alert(`Couldn't enter fullscreen: ${err.message}`));
      });

      const downloadBtn = document.getElementById("download-btn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", async () => {
          try {
            const access = await api.pointCloudDownloadAccessUrl(pcId);
            window.location.href = access.url;
          } catch (err) {
            alert(err.message);
          }
        });
      }

      if (!window.WebGLRenderingContext) {
        statusEl.textContent = "This browser doesn't support WebGL, which the point cloud viewer needs.";
        return;
      }

      try {
        const access = await api.pointCloudOctreeAccessUrl(pcId);
        Potree.workerPath = window.location.origin + "/vendor/potree/workers";
        Potree.resourcePath = window.location.origin + "/vendor/potree/resources";

        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(1_000_000);
        viewer.setBackground("black");
        viewer.loadGUI(() => {
          viewer.setLanguage("en");
          $("#menu_appearance").next().show();
          $("#menu_tools").next().show();
          viewer.toggleSidebar();
        });

        Potree.loadPointCloud(`${access.url}metadata.json`, "cloud", (e) => {
          if (!e || !e.pointcloud) {
            statusEl.textContent = "Could not load point cloud: the converted octree didn't load correctly.";
            statusEl.style.display = "flex";
            return;
          }
          const pointcloud = e.pointcloud;
          viewer.scene.addPointCloud(pointcloud);
          pointcloud.material.size = 1;
          pointcloud.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          viewer.fitToScreen();
          statusEl.style.display = "none";
        });
      } catch (err) {
        statusEl.textContent = `Could not load point cloud: ${err.message}`;
        statusEl.style.display = "flex";
      }
    }

    init();
  </script>
</body>
</html>

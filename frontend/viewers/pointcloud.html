<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Point Cloud Viewer — Volume Gallery</title>
<script><%= require("../js/theme-init.js?raw") %></script>
<link rel="stylesheet" href="<%= require('../css/style.css') %>" />
<link rel="stylesheet" href="/vendor/potree/potree.css" />
<link rel="stylesheet" href="/vendor/libs/jquery-ui/jquery-ui.min.css" />
<link rel="stylesheet" href="/vendor/libs/openlayers3/ol.css" />
<link rel="stylesheet" href="/vendor/libs/spectrum/spectrum.css" />
<link rel="stylesheet" href="/vendor/libs/jstree/themes/mixed/style.css" />
<style>
  body.viewer-page { overflow: hidden; }
  body.viewer-page .app-shell { height: 100vh; }
  body.viewer-page main {
    padding: 0; max-width: none; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .viewer-topbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5em;
    padding: 0.9em 1.4em; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--panel);
  }
  .viewer-topbar .viewer-titles { min-width: 0; }
  .viewer-topbar h1 { font-size: 1.1em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-topbar .viewer-desc { font-size: 0.83em; color: var(--text-dim); margin-top: 0.2em; max-width: 60ch; }
  .viewer-topbar-actions { display: flex; gap: 0.6em; flex-shrink: 0; }
  .icon-btn { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.5em 0.9em; white-space: nowrap; }
  .icon-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .pc-render-area { flex: 1; min-height: 0; position: relative; background: #000; }
  .pc-render-area .potree_container { position: absolute; inset: 0; }

  /* Potree's sidebar is loaded by viewer.loadGUI() into #potree_sidebar_container. Potree puts it on
     the left; here it sits on the right of the render area. Potree opens and closes it by moving
     the render area's edge (toggleSidebar(), replaced below to move the right edge instead). */
  #potree_sidebar_container {
    top: 0; right: 0; left: auto;
    border-right: 0; border-left: 1px solid var(--line);
  }
  #potree_render_area { transition: right 0.35s; }

  .pc-render-area .viewer-status { padding: 1.5em; text-align: left; line-height: 1.5; }

  /* Theme. Potree's stylesheet draws everything from these few variables, so pointing them at the
     app's palette (which follows the OS / the theme switch) themes the whole sidebar. */
  .pc-render-area .potree_container {
    --bg-color: var(--panel);
    --bg-color-2: var(--panel-raised);
    --bg-light-color: var(--panel-raised);
    --bg-dark-color: var(--bg);
    --font-color: var(--text);
    --font-color-2: var(--text);
    --color-1: var(--line);
    --color-2: var(--viewer-hover);
  }
  #potree_sidebar_container a { color: var(--accent); }
  #potree_sidebar_container .divider > span::before,
  #potree_sidebar_container .divider > span::after { background: var(--line); }

  /* Menu headings (Appearance, Tools, ...): plain <h3>s that Potree opens with slideToggle() on the
     panel after them. It draws them with a black text outline and a drop shadow that only work on its
     own dark theme; here they get a flat look and an arrow that follows the panel's open state
     (the panel's inline display is "none" while it is closed). */
  #potree_sidebar_container .accordion > h3 {
    position: relative; margin: 0; padding: 0.55em 0.8em 0.55em 2.2em;
    background: var(--panel-raised) !important;
    border: 0; border-top: 1px solid var(--line);
    color: var(--text); font-weight: 600; text-shadow: none; box-shadow: none;
  }
  #potree_sidebar_container .accordion > h3:hover { filter: none; background: var(--viewer-hover) !important; }
  #potree_sidebar_container .accordion > h3::before {
    content: ""; position: absolute; left: 1em; top: 50%; width: 0.4em; height: 0.4em; margin-top: -0.3em;
    border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform 0.2s;
  }
  #potree_sidebar_container .accordion > h3:has(+ :not([style*="display: none"])) { color: var(--accent); }
  #potree_sidebar_container .accordion > h3:has(+ :not([style*="display: none"]))::before { transform: rotate(45deg); }

  /* jQuery UI widgets inside the sidebar (Potree's own rules paint them light grey with !important) */
  #potree_sidebar_container .ui-widget-content { background: var(--panel); color: var(--text); border-color: var(--line); }
  #potree_sidebar_container .ui-state-default,
  #potree_sidebar_container .ui-button {
    background: var(--panel-raised) !important; color: var(--text); border: 1px solid var(--line);
  }
  #potree_sidebar_container .ui-state-hover,
  #potree_sidebar_container .ui-state-focus,
  #potree_sidebar_container .ui-button:hover,
  #potree_sidebar_container .ui-button:focus {
    background: var(--viewer-hover) !important; color: var(--text); border-color: var(--accent-dim);
  }
  #potree_sidebar_container .ui-state-active {
    background: var(--viewer-hover) !important; color: var(--text) !important; border-color: var(--accent-dim);
  }
  #potree_sidebar_container .ui-slider .ui-slider-handle {
    background: var(--accent) !important; border: 1px solid var(--accent-dim) !important;
  }
  #potree_sidebar_container input[type="range"] { accent-color: var(--accent); }
  #potree_sidebar_container input:not([type]), #potree_sidebar_container input[type="text"],
  #potree_sidebar_container input[type="number"], #potree_sidebar_container select,
  #potree_sidebar_container textarea {
    background: var(--panel-raised); color: var(--text); border: 1px solid var(--line);
  }
  #potree_sidebar_container .jstree-default .jstree-anchor { color: var(--text); }
  #potree_sidebar_container .jstree-default .jstree-clicked,
  #potree_sidebar_container .jstree-default .jstree-hovered { background: var(--viewer-hover) !important; }

  /* Drop-down lists of the sidebar's selects open in a menu appended to <body>. */
  .ui-selectmenu-menu .ui-menu { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .ui-selectmenu-menu .ui-state-active { background: var(--viewer-hover); color: var(--text); border-color: transparent; margin: 0; }
</style>
</head>
<body class="viewer-page">
  <div class="app-shell" id="shell"></div>

  <script src="/vendor/libs/jquery/jquery-3.1.1.js"></script>
  <script src="/vendor/libs/spectrum/spectrum.js"></script>
  <script src="/vendor/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="/vendor/libs/other/BinaryHeap.js"></script>
  <script src="/vendor/libs/tween/tween.min.js"></script>
  <script src="/vendor/libs/d3/d3.js"></script>
  <script src="/vendor/libs/proj4/proj4.js"></script>
  <script src="/vendor/libs/openlayers3/ol.js"></script>
  <script src="/vendor/libs/i18next/i18next.js"></script>
  <script src="/vendor/libs/jstree/jstree.js"></script>
  <script src="/vendor/potree/potree.js"></script>

</body>
</html>

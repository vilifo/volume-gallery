<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="no-referrer" />
<title>Set password — Volume Gallery</title>
<script><%= require("./js/theme-init.js?raw") %></script>
<link rel="stylesheet" href="<%= require('./css/style.css') %>" />
</head>
<body>
  <div class="login-shell">
   <div class="login-col">
    <div class="login-box">
      <div class="login-brand" data-pending>
        <div class="brand-logos" id="brand-logos"></div>
        <h1 id="app-name">Volume Gallery</h1>
        <p class="tagline" id="tagline"></p>
      </div>
      <p class="subtitle" id="subtitle">Checking your link\u2026</p>
      <div id="error" style="display:none" class="error-box"></div>
      <form id="pw-form" hidden>
        <input type="text" id="username" autocomplete="username" hidden />
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm-password">Repeat new password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="primary" style="width:100%" id="save">Set password</button>
      </form>
      <p style="margin-top:1em"><a href="/login.html">Go to the sign-in page</a></p>
    </div>
    <footer class="login-footer" id="login-footer" data-pending></footer>
   </div>
  </div>

</body>
</html>

services:
  nginx:
    container_name: volume-gallery-nginx
    depends_on:
      volume-gallery:
        condition: service_healthy
      volume-gallery-init:
        condition: service_completed_successfully
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      VG_UID: '568'
      VG_GID: '568'
      PUID: 568
      PGID: 568
      VG_HTTPS_PORT: ${VG_HTTPS_PORT:-8443}
      VG_NGINX_REQUEST_BUFFERING: ${VG_NGINX_REQUEST_BUFFERING:-off}
    image: vilfoges/volume-gallery-nginx:latest
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    ports:
      - ${VG_HTTP_PORT:-8080}:80
      - ${VG_HTTPS_PORT:-8443}:443
    restart: unless-stopped
    volumes:
      - /mnt/fast/storage/path/processing:/processing
      - /mnt/your/path/to/certs/:/etc/nginx/certs:ro
      - /mnt/your/path/to/app/data/volumes:/data/volumes:ro
      - /mnt/your/path/to/app/data/.uploads:/data/.uploads
  volume-gallery:
    container_name: volume-gallery
    depends_on:
      volume-gallery-init:
        condition: service_completed_successfully
    environment:
      VG_UID: '568'
      VG_GID: '568'
      PUID: 568
      PGID: 568
      VG_ACCESS_TOKEN_MINUTES: ${VG_ACCESS_TOKEN_MINUTES:-480}
      VG_ADMIN_PASSWORD: your-password
      VG_ADMIN_USER: ${VG_ADMIN_USER:-admin}
      VG_FILE_TOKEN_MINUTES: ${VG_FILE_TOKEN_MINUTES:-30}
      VG_PROCESSING_DIR: /processing
      VG_SECRET_KEY: your-secret-key
      VG_SHARD_ACCEL_REDIRECT: ${VG_SHARD_ACCEL_REDIRECT:-true}
      VG_UPLOAD_STAGING_MAX_AGE_HOURS: ${VG_UPLOAD_STAGING_MAX_AGE_HOURS:-24}
    expose:
      - '8000'
    image: vilfoges/volume-gallery:latest
    init: True
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    user: '568:568'
    volumes:
      - /mnt/fast/storage/path/processing:/processing
      - /mnt/your/path/to/app/branding:/branding:ro
      - /mnt/your/path/to/app/data:/data
  volume-gallery-init:
    command:
      - sh
      - '-c'
      - >
        set -eu

        mkdir -p /data/volumes /data/meshes /data/pointclouds /data/.uploads
        /processing/.uploads /processing/.nginx_client_body /processing/.nginx_proxy

        find /data /processing \( ! -user 568 -o ! -group 568 \) -exec chown 568:568 {} +
    container_name: volume-gallery-init
    image: busybox:1.37
    restart: 'no'
    user: '0:0'
    volumes:
      - /mnt/our/path/to/app/data:/data
      - /mnt/fast/storage/path/processing:/processing
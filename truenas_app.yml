services:
  volume-gallery:
    image: vilfoges/volume-gallery:latest
    container_name: volume-gallery
    restart: unless-stopped
    init: true
    user: ${VG_UID:-0}:${VG_GID:-0}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    expose:
      - "8000"
    environment:
      VG_SECRET_KEY: your_key_here
      VG_ADMIN_USER: ${VG_ADMIN_USER:-admin}
      VG_ADMIN_PASSWORD: your_password_here
      VG_ACCESS_TOKEN_MINUTES: ${VG_ACCESS_TOKEN_MINUTES:-480}
      VG_FILE_TOKEN_MINUTES: ${VG_FILE_TOKEN_MINUTES:-30}
      VG_PROCESSING_DIR: ${VG_PROCESSING_DIR:-}
    volumes:
      - /mnt/your/path/to/data/here:/data
      - /mnt/your/path/to/processing/here:/processing

  nginx:
    image: vilfoges/volume-gallery-nginx:latest
    container_name: volume-gallery-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      volume-gallery:
        condition: service_healthy
    ports:
      - ${VG_HTTP_PORT:-8080}:80
      - ${VG_HTTPS_PORT:-8443}:443
    environment:
      VG_HTTPS_PORT: ${VG_HTTPS_PORT:-8443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - /mnt/your/path/to/certs/here:/etc/nginx/certs:ro
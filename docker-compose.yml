{
  "services": {
    "volume-gallery": {
      "build": {
        "context": ".",
        "dockerfile": "backend/Dockerfile"
      },
      "image": "${VG_IMAGE:-volume-gallery:latest}",
      "container_name": "volume-gallery",
      "restart": "unless-stopped",
      "init": true,
      "user": "${VG_UID:-0}:${VG_GID:-0}",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "expose": [
        "8000"
      ],
      "environment": {
        "VG_SECRET_KEY": "${VG_SECRET_KEY}",
        "VG_ADMIN_USER": "${VG_ADMIN_USER:-admin}",
        "VG_ADMIN_PASSWORD": "${VG_ADMIN_PASSWORD}",
        "VG_ACCESS_TOKEN_MINUTES": "${VG_ACCESS_TOKEN_MINUTES:-480}",
        "VG_FILE_TOKEN_MINUTES": "${VG_FILE_TOKEN_MINUTES:-30}",
        "VG_PROCESSING_DIR": "${VG_PROCESSING_DIR:-}"
      },
      "volumes": [
        "${VG_HOST_DATA_DIR:-./data}:/data",
        "${VG_HOST_PROCESSING_DIR:-./processing}:/processing"
      ]
    },
    "nginx": {
      "image": "nginx:1.27-alpine",
      "container_name": "volume-gallery-nginx",
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "depends_on": {
        "volume-gallery": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "${VG_HTTP_PORT:-8080}:80",
        "${VG_HTTPS_PORT:-8443}:443"
      ],
      "environment": {
        "VG_HTTPS_PORT": "${VG_HTTPS_PORT:-8443}",
        "NGINX_ENVSUBST_OUTPUT_DIR": "/etc/nginx"
        },
      "volumes": [
        "./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro",
        "${VG_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro"
      ]
    }
  }
}
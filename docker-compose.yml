services:
  # One-shot helper that runs as root before everything else: creates the directories the app and
  # nginx share and makes them belong to VG_UID:VG_GID. Without it a bind mount that does not exist
  # yet is created by Docker as root:root, and a non-root app (or nginx, which hands uploads to
  # it as files) could not write there. It only touches files that have the wrong owner, so it is
  # quick after the first run. With the default VG_UID=0 it just creates the directories.
  volume-gallery-init:
    image: busybox:1.37
    container_name: volume-gallery-init
    restart: "no"
    user: "0:0"
    environment:
      VG_UID: ${VG_UID:-0}
      VG_GID: ${VG_GID:-0}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /data/volumes /data/meshes /data/pointclouds /data/.uploads /processing/.uploads
        if [ "$$VG_UID" != "0" ]; then
          find /data /processing ! -user "$$VG_UID" -exec chown "$$VG_UID:$$VG_GID" {} +
        fi
    volumes:
      - ${VG_HOST_DATA_DIR:-./data}:/data
      - ${VG_HOST_PROCESSING_DIR:-./processing}:/processing

  # Job queue for the conversions (volume / mesh / point cloud). AOF keeps queued jobs across a
  # restart of this container. Not published: only the app and the worker talk to it.
  redis:
    image: redis:7-alpine
    container_name: volume-gallery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  volume-gallery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${VG_IMAGE:-volume-gallery:latest}
    shm_size: '1gb'
    container_name: volume-gallery
    restart: unless-stopped
    init: true
    user: ${VG_UID:-0}:${VG_GID:-0}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    expose:
      - "8000"
    depends_on:
      volume-gallery-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      VG_REDIS_URL: ${VG_REDIS_URL:-redis://redis:6379/0}
      VG_JOB_TIMEOUT_HOURS: ${VG_JOB_TIMEOUT_HOURS:-72}
      VG_SECRET_KEY: ${VG_SECRET_KEY:?set VG_SECRET_KEY in .env (at least 32 characters, e.g. openssl rand -hex 32)}
      VG_ADMIN_USER: ${VG_ADMIN_USER:-admin}
      VG_ADMIN_PASSWORD: ${VG_ADMIN_PASSWORD}
      VG_ACCESS_TOKEN_MINUTES: ${VG_ACCESS_TOKEN_MINUTES:-480}
      VG_FILE_TOKEN_MINUTES: ${VG_FILE_TOKEN_MINUTES:-30}
      VG_CONVERTER_TIMEOUT_HOURS: ${VG_CONVERTER_TIMEOUT_HOURS:-24}
      VG_PROCESSING_DIR: ${VG_PROCESSING_DIR:-}
      VG_SHARD_ACCEL_REDIRECT: ${VG_SHARD_ACCEL_REDIRECT:-true}
      VG_UPLOAD_STAGING_MAX_AGE_HOURS: ${VG_UPLOAD_STAGING_MAX_AGE_HOURS:-24}
    volumes:
      - ${VG_HOST_DATA_DIR:-./data}:/data
      - ${VG_HOST_PROCESSING_DIR:-./processing}:/processing
      - ${VG_HOST_BRANDING_DIR:-./branding}:/branding:ro

  # Runs the conversions queued by the web app (same image, other command). It needs the same
  # data / processing folders, uid and settings as the app. One job at a time per container:
  #   docker compose up -d --scale volume-gallery-worker=2   for more parallelism (mind the RAM).
  volume-gallery-worker:
    image: ${VG_IMAGE:-volume-gallery:latest}
    shm_size: '1gb'
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    user: ${VG_UID:-0}:${VG_GID:-0}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true  # the image's check probes the web server on :8000
    depends_on:
      volume-gallery-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      volume-gallery:
        condition: service_healthy
    environment:
      VG_REDIS_URL: ${VG_REDIS_URL:-redis://redis:6379/0}
      VG_SECRET_KEY: ${VG_SECRET_KEY:?set VG_SECRET_KEY in .env (at least 32 characters, e.g. openssl rand -hex 32)}
      VG_CONVERTER_TIMEOUT_HOURS: ${VG_CONVERTER_TIMEOUT_HOURS:-24}
      VG_PROCESSING_DIR: ${VG_PROCESSING_DIR:-}
    volumes:
      - ${VG_HOST_DATA_DIR:-./data}:/data
      - ${VG_HOST_PROCESSING_DIR:-./processing}:/processing

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: volume-gallery-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      volume-gallery-init:
        condition: service_completed_successfully
      volume-gallery:
        condition: service_healthy
    ports:
      - ${VG_HTTP_PORT:-8080}:80
      - ${VG_HTTPS_PORT:-8443}:443
    environment:
      VG_HTTPS_PORT: ${VG_HTTPS_PORT:-8443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      VG_NGINX_REQUEST_BUFFERING: ${VG_NGINX_REQUEST_BUFFERING:-off}
      # nginx's workers run as this uid:gid (see nginx/docker-entrypoint.d): uploads reach the app
      # as files nginx wrote with mode 0600, which only the same user can read and rename.
      VG_UID: ${VG_UID:-0}
      VG_GID: ${VG_GID:-0}
    volumes:
      - ${VG_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      # Same host directory as the app's /processing: nginx writes uploads there, the app renames them.
      - ${VG_HOST_PROCESSING_DIR:-./processing}:/processing
      - ${VG_HOST_DATA_DIR:-./data}/volumes:/data/volumes:ro
      # Where mesh uploads land (the mesh original is kept in the data folder). Only this one
      # subdirectory of the data folder is writable for nginx.
      - ${VG_HOST_DATA_DIR:-./data}/.uploads:/data/.uploads

volumes:
  redis-data:

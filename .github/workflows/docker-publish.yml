name: Publish Docker image

# Builds backend/Dockerfile and pushes it to Docker Hub, so a TrueNAS box can
# `docker compose pull` a ready-made image instead of building it locally.
#
# One-time setup before this will do anything:
#   1. Create a Docker Hub access token: hub.docker.com -> Account Settings
#      -> Personal access tokens -> Generate (Read & Write scope is enough).
#   2. In this repo: Settings -> Secrets and variables -> Actions, add:
#        DOCKERHUB_USERNAME  = your Docker Hub username
#        DOCKERHUB_TOKEN     = the access token from step 1
#   3. In this repo: Settings -> Secrets and variables -> Actions -> Variables
#      tab, add:
#        DOCKERHUB_IMAGE     = yourusername/volume-gallery
#      (This is a "Variable", not a "Secret" — it's not sensitive, just the
#      repo name on Docker Hub. If you skip this, it defaults to
#      DOCKERHUB_USERNAME/volume-gallery below.)
#
# After that, every push to main publishes ":latest" (plus a ":<short-sha>"
# tag for traceability), and pushing a tag like "v1.2.0" also publishes
# ":v1.2.0". Nothing runs on other branches or on pull requests from forks
# (forks don't have access to your secrets, and shouldn't).

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}  # lets you trigger a rebuild manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/volume-gallery', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
